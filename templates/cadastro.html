{% extends "base.html" %}
{% block titulo %}Criar conta · CampusHub{% endblock %}

{% block conteudo %}
<div class="caixa-form">
    <h2>Criar conta</h2>
    <p class="subtitulo">Leva menos de um minuto.</p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" value="{{ nome or '' }}" maxlength="100" required autocomplete="name">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required autocomplete="email">

        <label for="senha">Senha <small class="dica">(mínimo de 8 caracteres)</small></label>
        <input type="password" id="senha" name="senha" minlength="8" required autocomplete="new-password">

        <label for="confirmar">Confirmar senha</label>
        <input type="password" id="confirmar" name="confirmar" minlength="8" required autocomplete="new-password">

        {# LGPD: a pessoa precisa concordar, de forma clara, com o uso dos dados dela #}
        <label class="check check-termos">
            <input type="checkbox" name="aceito" required>
            <span>Li e aceito a <a href="{{ url_for('auth.privacidade') }}" target="_blank" rel="noopener">Política de Privacidade</a></span>
        </label>

        <button type="submit" class="botao botao-cheio">Criar conta</button>
    </form>

    <p class="troca">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
</div>
{% endblock %}
