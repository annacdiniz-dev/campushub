{% extends "base.html" %}
{% block titulo %}Entrar · CampusHub{% endblock %}

{% block conteudo %}
<div class="caixa-form">
    <h2>Entrar</h2>
    <p class="subtitulo">Que bom te ver de novo!</p>

    <form method="POST">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>

        <label class="check">
            <input type="checkbox" name="lembrar"> Manter conectado
        </label>

        <button type="submit" class="botao botao-cheio">Entrar</button>
    </form>

    <p class="troca">Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Criar conta</a></p>
</div>
{% endblock %}
